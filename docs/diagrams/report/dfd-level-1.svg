    <path d="M 1300 240 L 960 240 L 960 285 L 1300 285" class="datastore-line" />
    <line x1="1010" y1="240" x2="1010" y2="285" class="datastore-line" />
    <text x="985" y="268" text-anchor="middle" class="datastore-id">D2</text>
    <text x="1025" y="268" class="datastore-name">Catalogue &amp; Fragrance Data</text>

    <path d="M 1300 370 L 960 370 L 960 415 L 1300 415" class="datastore-line" />
    <line x1="1010" y1="370" x2="1010" y2="415" class="datastore-line" />
