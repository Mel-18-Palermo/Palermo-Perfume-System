<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1f2937" />
    </marker>
    <style>
      .entity { fill: #ffffff; stroke: #111827; stroke-width: 2.5; font-weight: bold; font-size: 16px; }
      .process-bg { fill: #f8fafc; stroke: #111827; stroke-width: 2.5; rx: 12; ry: 12; }
      .process-line { stroke: #111827; stroke-width: 2; }
      .process-num { font-size: 14px; font-weight: bold; fill: #111827; }
      .process-title { font-size: 13.5px; font-weight: 600; fill: #111827; }
      .datastore-line { stroke: #111827; stroke-width: 2.5; fill: none; }
      .datastore-id { font-weight: bold; font-size: 14px; fill: #111827; }
      .datastore-name { font-size: 13px; font-weight: 600; fill: #111827; }
      .flow-line { stroke: #374151; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .flow-text { font-size: 12px; fill: #1f2937; font-weight: 600; text-anchor: middle; background-color: #ffffff; }
    </style>
