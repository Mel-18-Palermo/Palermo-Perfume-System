    <path d="M 960 146 L 880 146 L 880 449 L 588 449" class="flow-line" />
    <text x="880" y="300" class="flow-text">Min profile context</text>

    <path d="M 580 459 L 740 459 L 740 276 L 952 276" class="flow-line" />
    <text x="800" y="268" class="flow-text">Read verified facts</text>

    <path d="M 580 470 L 720 470 L 720 397 L 952 397" class="flow-line" />
    <text x="790" y="389" class="flow-text">Order fact lookup</text>

    <path d="M 580 484 L 760 484 L 760 644 L 952 644" class="flow-line" />
    <text x="810" y="636" class="flow-text">Quiz/support write</text>

    <path d="M 960 662 L 780 662 L 780 498 L 588 498" class="flow-line" />
    <text x="780" y="580" class="flow-text">Prior quiz/support context</text>

    <path d="M 580 442 L 680 442 L 680 420 L 1480 420 L 1480 465 L 1642 465" class="flow-line" />
    <text x="1080" y="412" class="flow-text">Minimised prompt / rationale</text>

    <!-- P4 Flows -->
    <path d="M 170 295 L 260 295 L 260 619 L 312 619" class="flow-line" />
    <text x="260" y="460" class="flow-text">Guest cart</text>

    <path d="M 170 605 L 220 605 L 220 654 L 312 654" class="flow-line" />
    <text x="220" y="630" class="flow-text">Checkout &amp; payment</text>

    <path d="M 580 615 L 700 615 L 700 281 L 952 281" class="flow-line" />
    <text x="770" y="273" class="flow-text">Price &amp; variant lookup</text>

    <path d="M 580 626 L 720 626 L 720 384 L 952 384" class="flow-line" />
    <text x="770" y="376" class="flow-text">Cart/order updates</text>

    <path d="M 960 406 L 740 406 L 740 636 L 588 636" class="flow-line" />
    <text x="740" y="520" class="flow-text">Order/invoice records</text>

    <path d="M 580 647 L 760 647 L 760 518 L 952 518" class="flow-line" />
    <text x="800" y="510" class="flow-text">Reservation/stock updates</text>

    <path d="M 960 531 L 780 531 L 780 658 L 588 658" class="flow-line" />
    <text x="780" y="595" class="flow-text">Stock balances</text>

    <path d="M 580 668 L 710 668 L 710 904 L 952 904" class="flow-line" />
    <text x="770" y="896" class="flow-text">Promotion rule query</text>

    <path d="M 580 640 L 680 640 L 680 580 L 1480 580 L 1480 635 L 1642 635" class="flow-line" />
    <text x="1080" y="572" class="flow-text">Payment intents &amp; results</text>

    <!-- P5 Flows -->
    <path d="M 170 615 L 200 615 L 200 810 L 312 810" class="flow-line" />
    <text x="200" y="710" class="flow-text">Reviews &amp; loyalty</text>

    <path d="M 960 411 L 800 411 L 800 789 L 588 789" class="flow-line" />
    <text x="800" y="600" class="flow-text">Purchase eligibility</text>

    <path d="M 580 790 L 952 790" class="flow-line" />
    <text x="770" y="782" class="flow-text">Review/loyalty updates</text>

    <path d="M 960 800 L 588 800" class="flow-line" />
    <text x="770" y="812" class="flow-text">Loyalty/referral records</text>

    <!-- P6 Flows -->
    <path d="M 1650 975 L 1500 975 L 1500 980 L 588 980" class="flow-line" />
    <text x="1050" y="972" class="flow-text">Catalogue, stock &amp; RBAC ops</text>

    <path d="M 580 952 L 640 952 L 640 283 L 952 283" class="flow-line" />
    <text x="760" y="275" class="flow-text">Catalogue updates</text>

    <path d="M 580 963 L 660 963 L 660 541 L 952 541" class="flow-line" />
    <text x="770" y="533" class="flow-text">Inventory/batch updates</text>

    <path d="M 580 970 L 680 970 L 680 798 L 952 798" class="flow-line" />
    <text x="780" y="790" class="flow-text">Review moderation / loyalty ops</text>

    <path d="M 580 977 L 700 977 L 700 922 L 952 922" class="flow-line" />
    <text x="790" y="914" class="flow-text">Admin/RBAC/audit updates</text>

    <path d="M 960 153 L 920 153 L 920 987 L 588 987" class="flow-line" />
    <text x="920" y="570" class="flow-text">Customer reporting (D1)</text>

    <path d="M 960 413 L 860 413 L 860 998 L 588 998" class="flow-line" />
    <text x="860" y="700" class="flow-text">Sales/order metrics (D3)</text>

    <path d="M 960 673 L 840 673 L 840 1008 L 588 1008" class="flow-line" />
