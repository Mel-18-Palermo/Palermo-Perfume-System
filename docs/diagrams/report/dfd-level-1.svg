    <line x1="950" y1="890" x2="950" y2="935" class="datastore-line" />
    <text x="925" y="918" text-anchor="middle" class="datastore-id">D7</text>
    <text x="965" y="918" class="datastore-name">Admin, Promotion &amp; Audit Data</text>
  </g>

  <!-- Connectors & Flows -->
  <g id="connectors">
    <!-- P1 Flows -->
    <path d="M 180 240 L 240 240 L 240 116 L 332 116" class="flow-line" />
    <text x="240" y="175" class="flow-text">Registration &amp; verification</text>

    <path d="M 180 535 L 220 535 L 220 144 L 332 144" class="flow-line" />
    <text x="220" y="340" class="flow-text">Profile &amp; session</text>

    <path d="M 590 130 L 892 130" class="flow-line" />
    <text x="745" y="122" class="flow-text">Read/Write account &amp; Identity</text>

    <path d="M 590 109 L 1492 109" class="flow-line" />
    <text x="1350" y="101" class="flow-text">Verification &amp; reset messages</text>

    <!-- P2 Flows -->
    <path d="M 180 265 L 250 265 L 250 286 L 332 286" class="flow-line" />
    <text x="250" y="278" class="flow-text">Browse &amp; filter</text>

    <path d="M 180 550 L 240 550 L 240 314 L 332 314" class="flow-line" />
    <text x="240" y="430" class="flow-text">Wheel queries</text>

    <path d="M 590 286 L 650 286 L 650 263 L 892 263" class="flow-line" />
    <text x="770" y="255" class="flow-text">Read perfumes &amp; notes</text>

    <path d="M 900 523 L 740 523 L 740 314 L 598 314" class="flow-line" />
    <text x="740" y="420" class="flow-text">Stock availability</text>

    <!-- P3 Flows -->
    <path d="M 180 275 L 260 275 L 260 456 L 332 456" class="flow-line" />
    <text x="260" y="365" class="flow-text">Quiz intent</text>

    <path d="M 180 565 L 250 565 L 250 484 L 332 484" class="flow-line" />
    <text x="250" y="525" class="flow-text">Custom context</text>

    <path d="M 900 146 L 770 146 L 770 442 L 598 442" class="flow-line" />
    <text x="770" y="294" class="flow-text">Min profile context</text>

    <path d="M 590 449 L 680 449 L 680 272 L 892 272" class="flow-line" />
    <text x="785" y="264" class="flow-text">Read verified facts</text>

    <path d="M 590 456 L 660 456 L 660 397 L 892 397" class="flow-line" />
    <text x="775" y="389" class="flow-text">Order facts lookup</text>

    <path d="M 590 491 L 700 491 L 700 653 L 892 653" class="flow-line" />
    <text x="795" y="645" class="flow-text">Save quiz/chat records</text>

    <path d="M 590 470 L 650 470 L 650 410 L 1492 410" class="flow-line" />
    <text x="1350" y="402" class="flow-text">Minimised prompt / rationale</text>

    <!-- P4 Flows -->
    <path d="M 180 270 L 270 270 L 270 619 L 332 619" class="flow-line" />
    <text x="270" y="445" class="flow-text">Guest cart</text>

    <path d="M 180 575 L 230 575 L 230 654 L 332 654" class="flow-line" />
    <text x="230" y="615" class="flow-text">Checkout &amp; payment</text>

    <path d="M 590 612 L 630 612 L 630 276 L 892 276" class="flow-line" />
    <text x="760" y="268" class="flow-text">Price &amp; variant lookup</text>

    <path d="M 590 626 L 650 626 L 650 388 L 892 388" class="flow-line" />
    <text x="770" y="380" class="flow-text">Orders &amp; payment state</text>

    <path d="M 590 640 L 670 640 L 670 523 L 892 523" class="flow-line" />
    <text x="780" y="515" class="flow-text">Stock reserve &amp; updates</text>

    <path d="M 590 661 L 660 661 L 660 904 L 892 904" class="flow-line" />
    <text x="775" y="896" class="flow-text">Promotion rule query</text>

    <path d="M 590 647 L 640 647 L 640 610 L 1492 610" class="flow-line" />
    <text x="1350" y="602" class="flow-text">Payment intents &amp; results</text>

    <!-- P5 Flows -->
    <path d="M 180 575 L 210 575 L 210 810 L 332 810" class="flow-line" />
    <text x="210" y="690" class="flow-text">Reviews &amp; loyalty</text>

    <path d="M 900 406 L 750 406 L 750 789 L 598 789" class="flow-line" />
    <text x="750" y="600" class="flow-text">Purchase eligibility</text>

    <path d="M 590 800 L 892 800" class="flow-line" />
    <text x="745" y="792" class="flow-text">Points &amp; review transactions</text>

    <!-- P6 Flows -->
    <path d="M 1500 970 L 598 970" class="flow-line" />
    <text x="1050" y="962" class="flow-text">Catalogue, stock &amp; RBAC ops</text>

    <path d="M 590 952 L 620 952 L 620 281 L 892 281" class="flow-line" />
    <text x="755" y="273" class="flow-text">Catalogue CRUD</text>

    <path d="M 590 959 L 640 959 L 640 536 L 892 536" class="flow-line" />
    <text x="765" y="528" class="flow-text">Inventory &amp; batch ops</text>

    <path d="M 590 966 L 660 966 L 660 796 L 892 796" class="flow-line" />
    <text x="775" y="788" class="flow-text">Review moderation</text>

    <path d="M 590 973 L 680 973 L 680 922 L 892 922" class="flow-line" />
    <text x="785" y="914" class="flow-text">Admin &amp; audit CRUD</text>

    <path d="M 590 994 L 710 994 L 710 720 L 1060 720 L 1060 683" class="flow-line" />
    <text x="885" y="712" class="flow-text">Reporting metrics (D1, D3, D5)</text>

    <path d="M 590 1008 L 630 1008 L 630 1060 L 1575 1060 L 1575 448" class="flow-line" />
    <text x="1100" y="1052" class="flow-text">Promo video context</text>
  </g>
</svg>
