<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 1100" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333" />
    </marker>
    <style>
      .entity { fill: #ffffff; stroke: #111827; stroke-width: 2; font-weight: bold; font-size: 14px; }
      .process-bg { fill: #f9fafb; stroke: #111827; stroke-width: 2; rx: 10; ry: 10; }
      .process-line { stroke: #111827; stroke-width: 1.5; }
      .process-num { font-size: 13px; font-weight: bold; fill: #111827; }
      .process-title { font-size: 13px; font-weight: 600; fill: #111827; }
      .datastore-line { stroke: #111827; stroke-width: 2; fill: none; }
      .datastore-id { font-weight: bold; font-size: 13px; fill: #111827; }
      .datastore-name { font-size: 13px; font-weight: 500; fill: #111827; }
      .flow-line { stroke: #333333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .flow-text { font-size: 11px; fill: #4b5563; font-weight: 500; text-anchor: middle; }
    </style>
  </defs>

  <!-- Title -->
  <text x="50" y="40" font-size="20" font-weight="bold" fill="#111827">Palermo Perfume System — DFD Level 1 (Gane &amp; Sarson Notation)</text>

  <!-- External Entities (Left) -->
  <g id="entities-left">
    <rect x="50" y="240" width="130" height="60" class="entity" />
    <text x="115" y="275" text-anchor="middle" dominant-baseline="middle">Visitor</text>

    <rect x="50" y="520" width="130" height="60" class="entity" />
    <text x="115" y="555" text-anchor="middle" dominant-baseline="middle">Customer</text>
  </g>

  <!-- External Entities (Right) -->
  <g id="entities-right">
    <rect x="1460" y="100" width="140" height="60" class="entity" />
    <text x="1530" y="135" text-anchor="middle" dominant-baseline="middle">Email Service</text>

    <rect x="1460" y="380" width="140" height="60" class="entity" />
    <text x="1530" y="415" text-anchor="middle" dominant-baseline="middle">AI Service</text>

    <rect x="1460" y="580" width="140" height="60" class="entity" />
    <text x="1530" y="615" text-anchor="middle" dominant-baseline="middle">Stripe</text>

    <rect x="1460" y="940" width="140" height="60" class="entity" />
    <text x="1530" y="975" text-anchor="middle" dominant-baseline="middle">Administrator</text>
  </g>

  <!-- Processes (1.0 to 6.0) -->
  <g id="processes">
    <!-- 1.0 -->
    <rect x="340" y="95" width="240" height="70" class="process-bg" />
    <line x1="340" y1="125" x2="580" y2="125" class="process-line" />
    <text x="460" y="115" text-anchor="middle" class="process-num">1.0</text>
    <text x="460" y="148" text-anchor="middle" class="process-title">Account &amp; Profile Management</text>

    <!-- 2.0 -->
    <rect x="340" y="265" width="240" height="70" class="process-bg" />
    <line x1="340" y1="295" x2="580" y2="295" class="process-line" />
    <text x="460" y="285" text-anchor="middle" class="process-num">2.0</text>
    <text x="460" y="318" text-anchor="middle" class="process-title">Catalogue &amp; Discovery</text>

    <!-- 3.0 -->
    <rect x="340" y="435" width="240" height="70" class="process-bg" />
    <line x1="340" y1="465" x2="580" y2="465" class="process-line" />
    <text x="460" y="455" text-anchor="middle" class="process-num">3.0</text>
    <text x="460" y="488" text-anchor="middle" class="process-title">Personalisation &amp; AI Support</text>

    <!-- 4.0 -->
    <rect x="340" y="605" width="240" height="70" class="process-bg" />
    <line x1="340" y1="635" x2="580" y2="635" class="process-line" />
    <text x="460" y="625" text-anchor="middle" class="process-num">4.0</text>
    <text x="460" y="658" text-anchor="middle" class="process-title">Cart, Order, Payment &amp; Delivery</text>

    <!-- 5.0 -->
    <rect x="340" y="775" width="240" height="70" class="process-bg" />
    <line x1="340" y1="805" x2="580" y2="805" class="process-line" />
    <text x="460" y="795" text-anchor="middle" class="process-num">5.0</text>
    <text x="460" y="828" text-anchor="middle" class="process-title">Community, Loyalty &amp; Referral</text>

    <!-- 6.0 -->
    <rect x="340" y="945" width="240" height="70" class="process-bg" />
    <line x1="340" y1="975" x2="580" y2="975" class="process-line" />
    <text x="460" y="965" text-anchor="middle" class="process-num">6.0</text>
    <text x="460" y="998" text-anchor="middle" class="process-title">Administration &amp; Operations</text>
  </g>

  <!-- Data Stores (D1 to D7) -->
  <g id="datastores">
    <!-- D1 -->
    <path d="M 1200 110 L 880 110 L 880 155 L 1200 155" class="datastore-line" />
    <line x1="930" y1="110" x2="930" y2="155" class="datastore-line" />
    <text x="905" y="138" text-anchor="middle" class="datastore-id">D1</text>
    <text x="945" y="138" class="datastore-name">Customer &amp; Profile Data</text>

    <!-- D2 -->
    <path d="M 1200 240 L 880 240 L 880 285 L 1200 285" class="datastore-line" />
    <line x1="930" y1="240" x2="930" y2="285" class="datastore-line" />
    <text x="905" y="268" text-anchor="middle" class="datastore-id">D2</text>
    <text x="945" y="268" class="datastore-name">Catalogue &amp; Fragrance Data</text>

    <!-- D3 -->
    <path d="M 1200 370 L 880 370 L 880 415 L 1200 415" class="datastore-line" />
    <line x1="930" y1="370" x2="930" y2="415" class="datastore-line" />
    <text x="905" y="398" text-anchor="middle" class="datastore-id">D3</text>
    <text x="945" y="398" class="datastore-name">Commerce &amp; Fulfilment Data</text>

    <!-- D4 -->
    <path d="M 1200 500 L 880 500 L 880 545 L 1200 545" class="datastore-line" />
    <line x1="930" y1="500" x2="930" y2="545" class="datastore-line" />
    <text x="905" y="528" text-anchor="middle" class="datastore-id">D4</text>
    <text x="945" y="528" class="datastore-name">Inventory &amp; Production Data</text>

    <!-- D5 -->
    <path d="M 1200 630 L 880 630 L 880 675 L 1200 675" class="datastore-line" />
    <line x1="930" y1="630" x2="930" y2="675" class="datastore-line" />
    <text x="905" y="658" text-anchor="middle" class="datastore-id">D5</text>
    <text x="945" y="658" class="datastore-name">Quiz, Rec &amp; Support Data</text>

    <!-- D6 -->
    <path d="M 1200 760 L 880 760 L 880 805 L 1200 805" class="datastore-line" />
    <line x1="930" y1="760" x2="930" y2="805" class="datastore-line" />
    <text x="905" y="788" text-anchor="middle" class="datastore-id">D6</text>
    <text x="945" y="788" class="datastore-name">Community &amp; Loyalty Data</text>

    <!-- D7 -->
    <path d="M 1200 890 L 880 890 L 880 935 L 1200 935" class="datastore-line" />
    <line x1="930" y1="890" x2="930" y2="935" class="datastore-line" />
    <text x="905" y="918" text-anchor="middle" class="datastore-id">D7</text>
    <text x="945" y="918" class="datastore-name">Admin, Promotion &amp; Audit Data</text>
  </g>

  <!-- Connectors & Data Flows -->
  <g id="connectors">
    <!-- P1 Flows -->
    <path d="M 180 255 L 250 255 L 250 130 L 332 130" class="flow-line" />
    <text x="250" y="195" class="flow-text">Credentials / Profile</text>

    <path d="M 580 130 L 872 130" class="flow-line" />
    <text x="730" y="122" class="flow-text">Profile data</text>

    <path d="M 580 110 L 1452 110" class="flow-line" />
    <text x="1330" y="102" class="flow-text">Auth emails</text>

    <!-- P2 Flows -->
    <path d="M 180 285 L 332 285" class="flow-line" />
    <text x="255" y="277" class="flow-text">Catalogue queries</text>

    <path d="M 580 260 L 872 260" class="flow-line" />
    <text x="730" y="252" class="flow-text">Read catalogue/notes</text>

    <path d="M 880 520 L 720 520 L 720 315 L 588 315" class="flow-line" />
    <text x="720" y="420" class="flow-text">Read stock</text>

    <!-- P3 Flows -->
    <path d="M 180 535 L 260 535 L 260 460 L 332 460" class="flow-line" />
    <text x="260" y="500" class="flow-text">Quiz / Chat</text>

    <path d="M 580 455 L 680 455 L 680 275 L 872 275" class="flow-line" />
    <text x="780" y="268" class="flow-text">Read verified facts</text>

    <path d="M 580 480 L 700 480 L 700 650 L 872 650" class="flow-line" />
    <text x="780" y="642" class="flow-text">Quiz &amp; logs</text>

    <path d="M 580 445 L 650 445 L 650 405 L 1452 405" class="flow-line" />
    <text x="1330" y="398" class="flow-text">Minimised prompt / rationale</text>

    <!-- P4 Flows -->
    <path d="M 180 555 L 260 555 L 260 630 L 332 630" class="flow-line" />
    <text x="260" y="595" class="flow-text">Cart &amp; Checkout</text>

    <path d="M 580 625 L 640 625 L 640 395 L 872 395" class="flow-line" />
    <text x="760" y="388" class="flow-text">Order records</text>

    <path d="M 580 655 L 670 655 L 670 535 L 872 535" class="flow-line" />
    <text x="760" y="528" class="flow-text">Reserve stock</text>

    <path d="M 580 640 L 640 640 L 640 600 L 1452 600" class="flow-line" />
    <text x="1330" y="592" class="flow-text">Payment token</text>

    <!-- P5 Flows -->
    <path d="M 180 575 L 240 575 L 240 810 L 332 810" class="flow-line" />
    <text x="240" y="700" class="flow-text">Reviews / Loyalty</text>

    <path d="M 580 800 L 872 800" class="flow-line" />
    <text x="730" y="792" class="flow-text">Points &amp; reviews</text>

    <path d="M 880 405 L 750 405 L 750 825 L 588 825" class="flow-line" />
    <text x="750" y="600" class="flow-text">Read eligibility</text>

    <!-- P6 Flows -->
    <path d="M 1460 970 L 588 970" class="flow-line" />
    <text x="1050" y="962" class="flow-text">Admin actions</text>

    <path d="M 580 985 L 670 985 L 670 915 L 872 915" class="flow-line" />
    <text x="770" y="907" class="flow-text">Admin &amp; audit CRUD</text>

    <path d="M 580 1005 L 630 1005 L 630 1050 L 1530 1050 L 1530 448" class="flow-line" />
    <text x="1100" y="1042" class="flow-text">Promo drafts</text>
  </g>
</svg>
