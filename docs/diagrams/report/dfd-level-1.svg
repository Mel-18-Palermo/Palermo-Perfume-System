    <line x1="1010" y1="500" x2="1010" y2="545" class="datastore-line" />
    <text x="985" y="528" text-anchor="middle" class="datastore-id">D4</text>
    <text x="1025" y="528" class="datastore-name">Inventory &amp; Production Data</text>

    <path d="M 1300 630 L 960 630 L 960 675 L 1300 675" class="datastore-line" />
    <line x1="1010" y1="630" x2="1010" y2="675" class="datastore-line" />
    <text x="985" y="658" text-anchor="middle" class="datastore-id">D5</text>
    <text x="1025" y="658" class="datastore-name">Quiz, Recommendation &amp; Support Data</text>

    <path d="M 1300 760 L 960 760 L 960 805 L 1300 805" class="datastore-line" />
    <line x1="1010" y1="760" x2="1010" y2="805" class="datastore-line" />
    <text x="985" y="788" text-anchor="middle" class="datastore-id">D6</text>
