    <line x1="320" y1="125" x2="580" y2="125" class="process-line" />
    <text x="450" y="115" text-anchor="middle" class="process-num">1.0</text>
    <text x="450" y="148" text-anchor="middle" class="process-title">Account &amp; Profile Management</text>

    <rect x="320" y="265" width="260" height="70" class="process-bg" />
    <line x1="320" y1="295" x2="580" y2="295" class="process-line" />
    <text x="450" y="285" text-anchor="middle" class="process-num">2.0</text>
    <text x="450" y="318" text-anchor="middle" class="process-title">Catalogue &amp; Discovery</text>

    <rect x="320" y="435" width="260" height="70" class="process-bg" />
    <line x1="320" y1="465" x2="580" y2="465" class="process-line" />
    <text x="450" y="455" text-anchor="middle" class="process-num">3.0</text>
    <text x="450" y="488" text-anchor="middle" class="process-title">Personalisation &amp; AI Support</text>

