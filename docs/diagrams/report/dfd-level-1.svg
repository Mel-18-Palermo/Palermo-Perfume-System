    <path d="M 170 585 L 220 585 L 220 314 L 312 314" class="flow-line" />
    <text x="220" y="450" class="flow-text">Fragrance wheel queries</text>

    <path d="M 580 295 L 952 295" class="flow-line" />
    <text x="770" y="287" class="flow-text">Read perfumes &amp; notes</text>

    <path d="M 960 514 L 820 514 L 820 321 L 588 321" class="flow-line" />
    <text x="820" y="415" class="flow-text">Stock availability</text>

