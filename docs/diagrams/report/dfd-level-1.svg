    <text x="770" y="112" class="flow-text">Customer/profile write</text>

    <path d="M 960 140 L 588 140" class="flow-line" />
    <text x="770" y="152" class="flow-text">Account &amp; identity lookup</text>

    <path d="M 580 105 L 700 105 L 700 50 L 1500 50 L 1500 110 L 1642 110" class="flow-line" />
