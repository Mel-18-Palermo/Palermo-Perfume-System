<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1150" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333" />
    </marker>
    <style>
      .entity { fill: #ffffff; stroke: #111827; stroke-width: 2; font-weight: bold; font-size: 14px; }
      .process-bg { fill: #f9fafb; stroke: #111827; stroke-width: 2; rx: 10; ry: 10; }
      .process-line { stroke: #111827; stroke-width: 1.5; }
      .process-num { font-size: 13px; font-weight: bold; fill: #111827; }
      .process-title { font-size: 12px; font-weight: 600; fill: #111827; }
      .datastore-line { stroke: #111827; stroke-width: 2; fill: none; }
      .datastore-id { font-weight: bold; font-size: 13px; fill: #111827; }
      .datastore-name { font-size: 12px; font-weight: 500; fill: #111827; }
      .flow-line { stroke: #333333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .flow-text { font-size: 10px; fill: #4b5563; font-weight: 500; text-anchor: middle; }
    </style>
  </defs>

  <text x="50" y="40" font-size="20" font-weight="bold" fill="#111827">Palermo Perfume System — DFD Level 1 (Gane &amp; Sarson Notation)</text>

  <!-- External Entities -->
  <g id="entities">
    <rect x="50" y="220" width="130" height="60" class="entity" />
    <text x="115" y="255" text-anchor="middle" dominant-baseline="middle">Visitor</text>

    <rect x="50" y="520" width="130" height="60" class="entity" />
    <text x="115" y="555" text-anchor="middle" dominant-baseline="middle">Customer</text>

    <rect x="1500" y="100" width="150" height="60" class="entity" />
    <text x="1575" y="135" text-anchor="middle" dominant-baseline="middle">Email delivery service</text>

    <rect x="1500" y="380" width="150" height="60" class="entity" />
    <text x="1575" y="415" text-anchor="middle" dominant-baseline="middle">AI service / API</text>

    <rect x="1500" y="580" width="150" height="60" class="entity" />
    <text x="1575" y="615" text-anchor="middle" dominant-baseline="middle">Stripe payment service</text>

    <rect x="1500" y="940" width="150" height="60" class="entity" />
    <text x="1575" y="975" text-anchor="middle" dominant-baseline="middle">Administrator</text>
  </g>

  <!-- 6 Processes -->
  <g id="processes">
    <!-- 1.0 -->
    <rect x="340" y="95" width="250" height="70" class="process-bg" />
    <line x1="340" y1="125" x2="590" y2="125" class="process-line" />
    <text x="465" y="115" text-anchor="middle" class="process-num">1.0</text>
    <text x="465" y="148" text-anchor="middle" class="process-title">Account &amp; Profile Management</text>

    <!-- 2.0 -->
    <rect x="340" y="265" width="250" height="70" class="process-bg" />
    <line x1="340" y1="295" x2="590" y2="295" class="process-line" />
    <text x="465" y="285" text-anchor="middle" class="process-num">2.0</text>
    <text x="465" y="318" text-anchor="middle" class="process-title">Catalogue, Discovery &amp; Virtual Fragrance</text>

    <!-- 3.0 -->
    <rect x="340" y="435" width="250" height="70" class="process-bg" />
    <line x1="340" y1="465" x2="590" y2="465" class="process-line" />
    <text x="465" y="455" text-anchor="middle" class="process-num">3.0</text>
    <text x="465" y="488" text-anchor="middle" class="process-title">Personalisation, Quiz &amp; AI Support</text>

    <!-- 4.0 -->
    <rect x="340" y="605" width="250" height="70" class="process-bg" />
    <line x1="340" y1="635" x2="590" y2="635" class="process-line" />
    <text x="465" y="625" text-anchor="middle" class="process-num">4.0</text>
    <text x="465" y="658" text-anchor="middle" class="process-title">Cart, Order, Payment &amp; Delivery</text>

    <!-- 5.0 -->
    <rect x="340" y="775" width="250" height="70" class="process-bg" />
    <line x1="340" y1="805" x2="590" y2="805" class="process-line" />
    <text x="465" y="795" text-anchor="middle" class="process-num">5.0</text>
    <text x="465" y="828" text-anchor="middle" class="process-title">Community, Loyalty &amp; Referral</text>

    <!-- 6.0 -->
    <rect x="340" y="945" width="250" height="70" class="process-bg" />
    <line x1="340" y1="975" x2="590" y2="975" class="process-line" />
    <text x="465" y="965" text-anchor="middle" class="process-num">6.0</text>
    <text x="465" y="998" text-anchor="middle" class="process-title">Administration &amp; Operations</text>
  </g>

  <!-- 7 Data Stores -->
  <g id="datastores">
    <!-- D1 -->
    <path d="M 1220 110 L 900 110 L 900 155 L 1220 155" class="datastore-line" />
    <line x1="950" y1="110" x2="950" y2="155" class="datastore-line" />
    <text x="925" y="138" text-anchor="middle" class="datastore-id">D1</text>
    <text x="965" y="138" class="datastore-name">Customer &amp; Profile Data</text>

    <!-- D2 -->
    <path d="M 1220 240 L 900 240 L 900 285 L 1220 285" class="datastore-line" />
    <line x1="950" y1="240" x2="950" y2="285" class="datastore-line" />
    <text x="925" y="268" text-anchor="middle" class="datastore-id">D2</text>
    <text x="965" y="268" class="datastore-name">Catalogue &amp; Fragrance Data</text>

    <!-- D3 -->
    <path d="M 1220 370 L 900 370 L 900 415 L 1220 415" class="datastore-line" />
    <line x1="950" y1="370" x2="950" y2="415" class="datastore-line" />
    <text x="925" y="398" text-anchor="middle" class="datastore-id">D3</text>
    <text x="965" y="398" class="datastore-name">Commerce &amp; Fulfilment Data</text>

    <!-- D4 -->
    <path d="M 1220 500 L 900 500 L 900 545 L 1220 545" class="datastore-line" />
    <line x1="950" y1="500" x2="950" y2="545" class="datastore-line" />
    <text x="925" y="528" text-anchor="middle" class="datastore-id">D4</text>
    <text x="965" y="528" class="datastore-name">Inventory &amp; Production Data</text>

    <!-- D5 -->
    <path d="M 1220 630 L 900 630 L 900 675 L 1220 675" class="datastore-line" />
    <line x1="950" y1="630" x2="950" y2="675" class="datastore-line" />
    <text x="925" y="658" text-anchor="middle" class="datastore-id">D5</text>
    <text x="965" y="658" class="datastore-name">Quiz, Recommendation &amp; Support Data</text>

    <!-- D6 -->
    <path d="M 1220 760 L 900 760 L 900 805 L 1220 805" class="datastore-line" />
    <line x1="950" y1="760" x2="950" y2="805" class="datastore-line" />
    <text x="925" y="788" text-anchor="middle" class="datastore-id">D6</text>
    <text x="965" y="788" class="datastore-name">Community &amp; Loyalty Data</text>

    <!-- D7 -->
