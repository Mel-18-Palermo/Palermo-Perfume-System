<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1150" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333" />
    </marker>
    <style>
      .entity { fill: #ffffff; stroke: #111827; stroke-width: 2; font-weight: bold; font-size: 14px; }
      .process-bg { fill: #f9fafb; stroke: #111827; stroke-width: 2; rx: 10; ry: 10; }
      .process-line { stroke: #111827; stroke-width: 1.5; }
      .process-num { font-size: 13px; font-weight: bold; fill: #111827; }
      .process-title { font-size: 12px; font-weight: 600; fill: #111827; }
      .datastore-line { stroke: #111827; stroke-width: 2; fill: none; }
      .datastore-id { font-weight: bold; font-size: 13px; fill: #111827; }
      .datastore-name { font-size: 12px; font-weight: 500; fill: #111827; }
      .flow-line { stroke: #333333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .flow-text { font-size: 10px; fill: #4b5563; font-weight: 500; text-anchor: middle; }
    </style>
  </defs>

  <text x="40" y="40" font-size="20" font-weight="bold" fill="#111827">Palermo Perfume System — DFD Level 1 (Gane &amp; Sarson Notation)</text>

  <!-- External Entities (Left) -->
  <g id="entities">
    <rect x="40" y="240" width="130" height="60" class="entity" />
    <text x="105" y="275" text-anchor="middle" dominant-baseline="middle">Visitor</text>

    <rect x="40" y="560" width="130" height="60" class="entity" />
    <text x="105" y="595" text-anchor="middle" dominant-baseline="middle">Customer</text>

    <rect x="1650" y="80" width="160" height="60" class="entity" />
    <text x="1730" y="115" text-anchor="middle" dominant-baseline="middle">Email delivery service</text>

    <rect x="1650" y="435" width="160" height="60" class="entity" />
    <text x="1730" y="470" text-anchor="middle" dominant-baseline="middle">AI service / API</text>

    <rect x="1650" y="605" width="160" height="60" class="entity" />
    <text x="1730" y="640" text-anchor="middle" dominant-baseline="middle">Stripe payment service</text>

    <rect x="1650" y="945" width="160" height="60" class="entity" />
    <text x="1730" y="980" text-anchor="middle" dominant-baseline="middle">Administrator</text>
  </g>

  <!-- 6 Processes -->
