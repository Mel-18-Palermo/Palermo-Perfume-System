<svg xmlns="http://www.w3.org/2000/svg" width="1169" height="826" viewBox="0 0 1169 826" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="call" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#000000"/></marker>
<marker id="ret" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5,0.5 L9.5,4 L0.5,7.5" fill="none" stroke="#000000" stroke-width="1.1"/></marker>
</defs>
<rect width="1169" height="826" fill="#ffffff"/>

<!-- title + legend -->
<text x="20" y="26" font-size="15" font-weight="bold" fill="#000000">9  Sequence Diagram &#8212; Checkout / Payment Journey</text>
<text x="1149" y="26" font-size="10" fill="#000000" text-anchor="end">solid arrow = call / message   &#183;   dashed arrow = return   &#183;   alt = conditional branch</text>

<!-- lifelines -->
<g stroke="#000000" stroke-width="1" stroke-dasharray="4 4">
<line x1="80" y1="82" x2="80" y2="808"/>
<line x1="240" y1="82" x2="240" y2="808"/>
<line x1="450" y1="82" x2="450" y2="808"/>
<line x1="720" y1="82" x2="720" y2="808"/>
<line x1="900" y1="82" x2="900" y2="808"/>
<line x1="1070" y1="82" x2="1070" y2="808"/>
</g>

<!-- participants -->
<g fill="#ffffff" stroke="#000000" stroke-width="1.4">
<rect x="20" y="40" width="120" height="42"/>
<rect x="178" y="40" width="124" height="42"/>
<rect x="383" y="40" width="134" height="42"/>
<rect x="658" y="40" width="124" height="42"/>
<rect x="848" y="40" width="104" height="42"/>
<rect x="990" y="40" width="160" height="42"/>
</g>
<g font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">
<text x="80" y="66">Customer</text>
<text x="240" y="57">Palermo</text><text x="240" y="71">Web UI</text>
<text x="450" y="57">Palermo</text><text x="450" y="71">Application</text>
<text x="720" y="57">Palermo</text><text x="720" y="71">Database</text>
<text x="900" y="66">Stripe</text>
<text x="1070" y="57">Internal Delivery</text><text x="1070" y="71">Simulator</text>
</g>

<g font-size="11" fill="#000000" text-anchor="middle">
<!-- 1 -->
<line x1="80" y1="108" x2="240" y2="108" stroke="#000000" marker-end="url(#call)"/>
<text x="160" y="99">1. start checkout</text>
<!-- 2 -->
<line x1="240" y1="133" x2="450" y2="133" stroke="#000000" marker-end="url(#call)"/>
<text x="345" y="124">2. submit checkout</text>
<!-- 3 self -->
<path d="M450,156 H512 V178 H450" fill="none" stroke="#000000" marker-end="url(#call)"/>
<text x="520" y="161" text-anchor="start">3. verify authenticated</text>
<text x="520" y="175" text-anchor="start">ACTIVE Customer</text>
<!-- 4 -->
<line x1="450" y1="203" x2="720" y2="203" stroke="#000000" marker-end="url(#call)"/>
<text x="585" y="194">4. revalidate cart, price, promo &amp; stock</text>
<line x1="720" y1="228" x2="450" y2="228" stroke="#000000" stroke-dasharray="5 4" marker-end="url(#ret)"/>
<text x="585" y="219">current cart / price / promo / stock</text>
<!-- 5 -->
<line x1="450" y1="253" x2="720" y2="253" stroke="#000000" marker-end="url(#call)"/>
<text x="585" y="244">5. create bounded inventory reservation</text>
<line x1="720" y1="278" x2="450" y2="278" stroke="#000000" stroke-dasharray="5 4" marker-end="url(#ret)"/>
<text x="585" y="269">reservation confirmed</text>
<!-- 6 -->
<line x1="450" y1="303" x2="720" y2="303" stroke="#000000" marker-end="url(#call)"/>
<text x="585" y="294">6. create order &amp; payment snapshot</text>
<line x1="720" y1="328" x2="450" y2="328" stroke="#000000" stroke-dasharray="5 4" marker-end="url(#ret)"/>
<text x="585" y="319">snapshot stored</text>
<!-- 7 -->
<line x1="80" y1="355" x2="900" y2="355" stroke="#000000" marker-end="url(#call)"/>
<rect x="377" y="335" width="228" height="15" fill="#ffffff" stroke="none"/>
<text x="491" y="346">7. complete payment (provider-controlled)</text>
<!-- 8 -->
<line x1="900" y1="380" x2="450" y2="380" stroke="#000000" marker-end="url(#call)"/>
<rect x="568" y="360" width="214" height="15" fill="#ffffff" stroke="none"/>
<text x="675" y="371">8. payment result (verified server-side)</text>
</g>

<!-- note -->
<path d="M20,396 H446 L460,410 V436 H20 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
<path d="M446,396 V410 H460" fill="none" stroke="#000000" stroke-width="1.2"/>
<text x="32" y="414" font-size="10" fill="#000000">Duplicate checkout / provider result &#8594; existing transaction outcome is reused;</text>
<text x="32" y="428" font-size="10" fill="#000000">no duplicate order, invoice or inventory effect.</text>

<!-- alt frame -->
<rect x="20" y="446" width="1130" height="354" fill="none" stroke="#000000" stroke-width="1.4"/>
<path d="M20,446 H66 V461 L57,468 H20 Z" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text x="43" y="461" font-size="11" font-weight="bold" text-anchor="middle" fill="#000000">alt</text>
<rect x="76" y="451" width="120" height="14" fill="#ffffff" stroke="none"/>
<text x="78" y="461" font-size="10" font-style="italic" fill="#000000">[ payment successful ]</text>

<g font-size="11" fill="#000000" text-anchor="middle">
<!-- 9 -->
<line x1="450" y1="484" x2="720" y2="484" stroke="#000000" marker-end="url(#call)"/>
<text x="585" y="475">9. record successful payment</text>
<!-- 10 -->
<line x1="450" y1="509" x2="720" y2="509" stroke="#000000" marker-end="url(#call)"/>
<text x="585" y="500">10. commit inventory &amp; movement (exactly once)</text>
<!-- 11 -->
<line x1="450" y1="534" x2="720" y2="534" stroke="#000000" marker-end="url(#call)"/>
<text x="585" y="525">11. confirm order &amp; invoice (exactly once)</text>
<line x1="720" y1="559" x2="450" y2="559" stroke="#000000" stroke-dasharray="5 4" marker-end="url(#ret)"/>
<text x="585" y="550">order confirmed + invoice</text>
<!-- 12 -->
<line x1="450" y1="584" x2="1070" y2="584" stroke="#000000" marker-end="url(#call)"/>
<rect x="669" y="564" width="182" height="15" fill="#ffffff" stroke="none"/>
<text x="760" y="575">12. create one simulated shipment</text>
<line x1="1070" y1="609" x2="450" y2="609" stroke="#000000" stroke-dasharray="5 4" marker-end="url(#ret)"/>
<rect x="708" y="589" width="104" height="15" fill="#ffffff" stroke="none"/>
<text x="760" y="600">shipment reference</text>
<!-- back to UI / customer -->
<line x1="450" y1="634" x2="240" y2="634" stroke="#000000" stroke-dasharray="5 4" marker-end="url(#ret)"/>
<text x="345" y="625">checkout complete</text>
<!-- 13 -->
<line x1="240" y1="659" x2="80" y2="659" stroke="#000000" marker-end="url(#call)"/>
<rect x="45" y="639" width="232" height="15" fill="#ffffff" stroke="none"/>
<text x="161" y="650">13. order confirmation / invoice / tracking</text>
</g>

<!-- alt divider -->
<line x1="20" y1="674" x2="1150" y2="674" stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4"/>
<rect x="30" y="679" width="204" height="14" fill="#ffffff" stroke="none"/>
<text x="32" y="689" font-size="10" font-style="italic" fill="#000000">[ payment failed / reservation expired ]</text>

<g font-size="11" fill="#000000" text-anchor="middle">
<line x1="450" y1="712" x2="720" y2="712" stroke="#000000" marker-end="url(#call)"/>
<text x="585" y="703">record non-successful outcome</text>
<line x1="450" y1="737" x2="720" y2="737" stroke="#000000" marker-end="url(#call)"/>
<text x="585" y="728">release reservation (safe)</text>
<line x1="450" y1="762" x2="240" y2="762" stroke="#000000" stroke-dasharray="5 4" marker-end="url(#ret)"/>
<text x="345" y="753">failure / retry state</text>
<line x1="240" y1="787" x2="80" y2="787" stroke="#000000" marker-end="url(#call)"/>
<text x="160" y="778">show failure / retry state</text>
</g>
</svg>
