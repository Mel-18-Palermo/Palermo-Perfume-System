<text x="36" y="751" font-size="9.5">Notation: rounded box = process (number in the top strip);  open-ended box = data store;  shadowed box = external entity, drawn outside the system boundary.</text>
<text x="36" y="765" font-size="9.5">*  marks a duplicated symbol drawn twice to reduce crossing connectors. Both Customer symbols are the same single entity; both D3 symbols are the same single data store.</text>
<text x="36" y="779" font-size="9.5">Delivery simulation (4.5.1) is an internal component of process 4.5, not an external entity. Every data flow is one-directional and named.</text>
