name: Project task
description: Define an assessable, reviewable unit of team work.
title: "[Task]: "
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State the concrete deliverable and why it is needed.
    validations:
      required: true
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      options:
        - Requirements and use cases
        - Project management and report
        - UI/UX
        - Database analysis
        - Backend, security, and integration
        - Testing and quality assurance
        - Shared team activity
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Deliverable is committed on a non-main branch
        - [ ] Evidence is linked
        - [ ] Relevant checks pass
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence required
      description: List files, screenshots, tests, diagrams, or review records expected.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and blockers
