name: Feature request
description: Propose a change tied to an approved requirement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: input
    id: requirement
    attributes:
      label: Requirement or assessment item
      placeholder: FR-01, NFR-02, or assessment criterion
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the user need without prescribing implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] Tests or evidence are attached
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security, privacy, data, or integration risks
