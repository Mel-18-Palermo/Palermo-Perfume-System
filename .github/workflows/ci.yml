name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      # Generate Prisma and Next types before type-aware ESLint on a clean checkout.
      - name: Type-check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit and contract tests
        run: pnpm test
      - name: Production build without service credentials
        run: pnpm build

  database:
    name: Database integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: palermo_ci
          POSTGRES_USER: postgres
          # Disposable runner-local fixture, never a hosted database credential.
          POSTGRES_PASSWORD: palermo_ci_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d palermo_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PALERMO_DATABASE_ENV: development
      TEST_DATABASE_URL: postgresql://palermo_ci:palermo_ci_fixture@localhost:5432/palermo_ci?schema=palermo_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Provision isolated schemas and restricted database role
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: palermo_ci
          PGPASSWORD: palermo_ci_fixture
        run: psql --no-psqlrc --set ON_ERROR_STOP=1 --file .github/workflows/ci-database.sql
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Migration, seed and database integrity tests
        run: pnpm test:db

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [quality, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every job to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: test "$QUALITY_RESULT" = success && test "$DATABASE_RESULT" = success
