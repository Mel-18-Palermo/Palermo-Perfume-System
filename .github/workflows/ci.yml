name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'agent/**'
      - 'feature/**'
      - 'fix/**'
      - 'docs/**'
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: palermo_test
          MYSQL_USER: palermo
          MYSQL_PASSWORD: palermo_ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: palermo_test
      DB_USERNAME: palermo
      DB_PASSWORD: palermo_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, pdo, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run quality and test suite
        run: composer ci
